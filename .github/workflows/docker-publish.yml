name: Publish Docker Image to GHCR

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Yamlr version to build (e.g. 0.1.4)'
        required: false
        default: '0.1.4'
  release:
    types: [published]

permissions:
  contents: read
  packages: write

jobs:
  docker:
    name: Build & Push Multi-Arch OCI Image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Determine Version
        id: ver
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="${{ inputs.version }}"
          elif [ "${{ github.event_name }}" = "release" ]; then
            VERSION="${{ github.event.release.tag_name }}"
            VERSION="${VERSION#v}"
          else
            VERSION="0.1.4"
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Build and push multi-arch image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          build-args: |
            YAMLR_VERSION=${{ steps.ver.outputs.version }}
          push: true
          tags: |
            ghcr.io/yamlr/yamlr:latest
            ghcr.io/yamlr/yamlr:${{ steps.ver.outputs.version }}
            ghcr.io/yamlr/yamlr:v${{ steps.ver.outputs.version }}
