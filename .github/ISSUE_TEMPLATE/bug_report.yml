name: 🐛 Bug Report
description: Report unexpected behavior, false-positive diagnostics, or broken manifest repairs.
title: "[BUG]: "
labels: ["kind/bug", "status/triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for helping improve Yamlr! Please provide sufficient details so we can reproduce the behavior.
  - type: input
    id: version
    attributes:
      label: Yamlr Version
      description: Run yamlr version and paste the output.
      placeholder: "e.g., yamlr v0.1.0 (Rust Native Standalone Core)"
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: OS & Target Kubernetes Version
      description: Operating system and target Kubernetes version (-k 1.36).
      placeholder: "e.g., Ubuntu 24.04 LTS, macOS Apple Silicon, K8s v1.31"
    validations:
      required: true
  - type: textarea
    id: manifest-sample
    attributes:
      label: Minimal Reproducible Manifest (Sanitized)
      description: Minimal YAML manifest snippet that triggers the issue (remove any sensitive credentials).
      render: yaml
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What did you expect yamlr to do?
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual Output / Diff
      description: What was the actual output or diff produced by yamlr heal or yamlr scan?
    validations:
      required: true
